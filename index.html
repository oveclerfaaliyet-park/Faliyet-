<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saha Uygulaması</title>

<link rel="manifest" href="manifest.json">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:20px;
}

#splash{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#splash img{
  width:220px;
}

.container{
  max-width:900px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.userInfo{
  font-size:14px;
  opacity:.8;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-bottom:10px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:12px;
  border-bottom:1px solid #334155;
}

.deleteBtn{
  background:red;
}

.done{
  background:#14532d !important;
}

@media(max-width:700px){

  table{
    font-size:13px;
  }

  button{
    padding:8px 12px;
  }

}

</style>
</head>
<body>

<div id="splash">
  <img src="anfa.gif">
</div>

<div class="container">

  <div class="topbar">

    <div>
      <h2>Saha Uygulaması</h2>
      <div class="userInfo" id="userInfo">
        Giriş yapılmadı
      </div>
    </div>

    <div>
      <button id="googleLogin">
        Google Giriş
      </button>

      <button id="logoutBtn">
        Çıkış
      </button>
    </div>

  </div>

  <div class="card">

    <input type="text" id="taskInput" placeholder="Görev gir">

    <input type="datetime-local" id="startDateTime">

    <input type="datetime-local" id="endDateTime">

    <button onclick="addTask()">
      Görev Ekle
    </button>

  </div>

  <div class="card">

    <table>

      <thead>
        <tr>
          <th>Görev</th>
          <th>Başlangıç</th>
          <th>Bitiş</th>
          <th>İşlem</th>
        </tr>
      </thead>

      <tbody id="taskList"></tbody>

    </table>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
