<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANFA Güvenlik</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  margin:0;
  min-height:100vh;
  background:#fff;
  color:#0b2c4d;
}

header{
  background:#0b5d1e;
  color:#fff;
  padding:20px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  font-size:22px;
  font-weight:600;
  letter-spacing:2px;
}

.container{padding:20px;max-width:600px;margin:auto}

.card{
  background:rgba(255,255,255,.95);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

label{font-weight:600;display:block;margin-bottom:6px}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  font-family:'Poppins';
}

button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#0b5d1e,#1f8a3a);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:active{transform:scale(.98)}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#fff;
  padding:22px;
  border-radius:16px;
  width:90%;
  max-width:400px;
}

.modal-content button{
  margin-top:12px;
}
</style>
</head>
<body>

<header>
<div onclick="openSettings()">⚙️</div>
</header>

<div class="container">

<div class="card" id="etapSelectCard">
<label>Etap Seçimi</label>
<select id="etapSelect">
<option>1 Etap</option>
<option selected>2 Etap</option>
</select>
</div>

<div class="card">
<label>Vardiya</label>
<select id="vardiyaSelect">
<option id="v1">08:00/20:00</option>
<option id="v2">20:00/08:00</option>
</select>
</div>

<div class="card">
<label>Doluluk Oranı (%)</label>
<input type="number" id="dolulukInput">
</div>

<div class="card">
<label>Vatandaş Sayısı</label>
<input type="number" id="vatandasInput">
</div>

<div class="card" id="raporText"></div>

<button onclick="copyText()">Metni Kopyala</button>

</div>

<!-- AYARLAR -->
<div id="settingsModal" class="modal">
<div class="modal-content">
<h3>Ayarlar</h3>

<label>Bölge</label>
<input id="bolgeSet">

<label>Park</label>
<input id="parkSet">

<label>1. Vardiya Saati</label>
<input id="vardiya1Set">

<label>2. Vardiya Saati</label>
<input id="vardiya2Set">

<label>Etap Aç / Kapat</label>
<button onclick="toggleEtap()">Etap Durumu</button>

<button onclick="closeSettings()">Kapat</button>
</div>
</div>

<script>
let etapOpen=true;

function nowDate(){
const d=new Date();
return d.toLocaleDateString("tr-TR");
}
function nowTime(){
const d=new Date();
return d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}

function buildText(){
const text=`
${nowDate()} Tarihinde
${vardiyaSelect.value} vardiyasında
${nowTime()} saatinde parkımızdaki

Doluluk oranı : %${dolulukInput.value||""}
Vatandaş sayısı: ${vatandasInput.value||""}

Bilginize Müdürüm.
`;
raporText.innerText=text;
}

setInterval(buildText,1000);
["vardiyaSelect","dolulukInput","vatandasInput"].forEach(e=>{
document.getElementById(e).oninput=buildText;
});

function openSettings(){
bolgeSet.value=localStorage.bolge||"DİKMEN BÖLGESİ";
parkSet.value=localStorage.park||"ÖVEÇLER VADİSİ PARKI";

vardiya1Set.value=localStorage.v1||"08:00/20:00";
vardiya2Set.value=localStorage.v2||"20:00/08:00";

v1.innerText=vardiya1Set.value;
v2.innerText=vardiya2Set.value;

settingsModal.style.display="flex";
}
function closeSettings(){settingsModal.style.display="none";}

bolgeSet.oninput=()=>localStorage.bolge=bolgeSet.value;
parkSet.oninput=()=>localStorage.park=parkSet.value;

vardiya1Set.oninput=()=>{
localStorage.v1=vardiya1Set.value;
v1.innerText=vardiya1Set.value;
}

vardiya2Set.oninput=()=>{
localStorage.v2=vardiya2Set.value;
v2.innerText=vardiya2Set.value;
}

function toggleEtap(){
etapOpen=!etapOpen;
etapSelectCard.style.display=etapOpen?"block":"none";
}

function copyText(){
const sabitBaslik = `
Çevre 1 Güvenlik Müdürlüğü
${localStorage.bolge || "DİKMEN BÖLGESİ"}
${localStorage.park || "ÖVEÇLER VADİSİ PARKI"}
${etapSelect.value}

`;
navigator.clipboard.writeText(sabitBaslik + raporText.innerText);
alert("Metin kopyalandı");
}

buildText();
</script>
</body>
</html>
